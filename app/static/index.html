<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planificador de Vuelos · AeroRutas</title>

  <!-- Leaflet: la librería que dibuja el mapa interactivo -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Nuestros estilos -->
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

  <!-- Barra superior: marca y aviso de que es un trabajo académico -->
  <header class="topbar">
    <div class="marca">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5L21 16z"/></svg>
      </div>
      <div class="texto">
        Aero<span>Rutas</span>
        <small>Planificador de Vuelos</small>
      </div>
    </div>
    <span class="aviso-mockup">Complejidad Algorítmica</span>
  </header>

  <div class="contenedor">

    <!-- Panel lateral: buscadores y resultados -->
    <aside class="panel">

      <section class="buscador-tarjeta">
        <!-- Buscador de origen -->
        <div class="campo-busqueda">
          <label for="origen">Desde</label>
          <div class="campo">
            <input id="origen" type="text" placeholder="Código o ciudad · ej. LIM" autocomplete="off" />
            <ul id="lista-origen" class="autocompletado"></ul>
          </div>
        </div>

        <!-- Buscador de destino -->
        <div class="campo-busqueda">
          <label for="destino">Hacia</label>
          <div class="campo">
            <input id="destino" type="text" placeholder="Código o ciudad · ej. BSB" autocomplete="off" />
            <ul id="lista-destino" class="autocompletado"></ul>
          </div>
        </div>

        <button id="buscar" class="boton">Buscar ruta</button>
      </section>

      <!-- Mensajes de error / estado -->
      <div id="mensaje" class="mensaje"></div>

      <!-- Tarjetas con los resultados -->
      <div id="resultados" class="resultados"></div>

    </aside>

    <!-- Mapa -->
    <main id="mapa"></main>

  </div>

  <!-- Leaflet y nuestra lógica -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
